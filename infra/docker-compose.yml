services:
  # PostgreSQL with PostGIS extension
  postgres:
    image: postgis/postgis:18-3.6
    container_name: mazraebaan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mazraebaan
      POSTGRES_PASSWORD: mazraebaan_dev_pass
      POSTGRES_MULTIPLE_DATABASES: identity_db,accounts_db,farms_db,analysis_db,subscriptions_db,notifications_db,chat_db,bot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mazraebaan"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mazraebaan-network

  # Redis for caching
  redis:
    image: redis:8.4.4-alpine
    container_name: mazraebaan-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mazraebaan-network

  # RabbitMQ for message queuing
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    container_name: mazraebaan-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: mazraebaan
      RABBITMQ_DEFAULT_PASS: mazraebaan_dev_pass
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mazraebaan-network

  # MinIO for object storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: mazraebaan-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mazraebaan
      MINIO_ROOT_PASSWORD: mazraebaan_dev_pass
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - mazraebaan-network

  # MinIO client for creating buckets on startup
  minio-init:
    image: minio/mc:latest
    container_name: mazraebaan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 mazraebaan mazraebaan_dev_pass;
      mc mb myminio/farm-imagery --ignore-existing;
      mc mb myminio/analysis-results --ignore-existing;
      mc mb myminio/user-uploads --ignore-existing;
      mc anonymous set download myminio/analysis-results;
      echo 'Buckets created successfully';
      "
    networks:
      - mazraebaan-network

networks:
  mazraebaan-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
